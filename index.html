    <!--
      Content-Security-Policy via meta tag — GitHub Pages doesn't let us set real HTTP
      headers, so this is a partial substitute. It can't cover frame-ancestors or
      report-uri (browsers ignore those in a meta tag), but it does restrict which
      origins scripts, styles, fonts, images, media, and API calls can come from.
      'unsafe-inline' is scoped to style-src only, to allow the handful of remaining
      inline style attributes (dynamic gradients, per-category colors) — script-src
      has no such exception.
    -->

      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://philip-portfolio-assets.s3.eu-north-1.amazonaws.com https://img.youtube.com; media-src 'self' https://philip-portfolio-assets.s3.eu-north-1.amazonaws.com; connect-src 'self' https://api.emailjs.com; frame-src https://www.youtube.com; object-src 'none'; base-uri 'self'; form-action 'self';"
